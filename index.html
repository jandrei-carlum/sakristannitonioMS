.strip{display:grid;grid-template-columns:1fr 1.9fr 1fr;margin-bottom:.75rem}

.na{color:#aaa1b4}

const easter=y=>{const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;return new Date(y,Math.floor(n/31)-1,n%31+1)};
function season(){
  const d=new Date(),y=d.getFullYear(),t=new Date(y,d.getMonth(),d.getDate()),o=Math.round((t-easter(y))/864e5);
  const A=new Date(y,11,25);A.setDate(4-(A.getDay()||7));
  const P=n=>({n,c:"#8f77c4"}),W=n=>({n,c:"#fbf6ea"}),R=n=>({n,c:"#d0655b"});
  if(t>=new Date(y,11,25))return W("Christmas");
  if(t>=A)return P("Advent");
  if(t<=new Date(y,0,12))return W("Christmas");
  if(o>=-46&&o<0)return o==-7?R("Palm Sunday"):o==-3?W("Holy Thursday"):o==-2?R("Good Friday"):o>-7?P("Holy Week"):P("Lent");
  if(o>=0&&o<49)return W("Easter");
  return o==49?R("Pentecost"):{n:"Ordinary Time",c:"#5fa57c"};

function dash(){
  const n=s=>members.filter(m=>m.status===s).length,A=n("Active"),I=n("Inactive");

  const gc=GROUPS.map(g=>members.filter(m=>m.group===g).length),mx=Math.max(1,...gc),ng=members.length-gc.reduce((a,b)=>a+b,0);

    return `<button class="li${dd<dn?" past":""}" data-id="${m.id}"><span class="db"><b>${dd}</b><small>${D(m.birthday).toLocaleDateString("en",{month:"short"})}</small></span><span class="lt"><b>${esc(nm(m))}</b><small>Turns ${yr-+m.birthday.slice(0,4)}${m.group?" · Group "+esc(m.group):""}</small></span>${dd===dn?'<span class="pill y">Today</span>':""}</button>`}).join("")
    +(bd.length>5?`<button class="more" id="bdt">${bdAll?"Show less":"Show all "+bd.length}</button>`:""):'<p class="none">No birthdays this month.</p>';

  const holder=r=>members.find(m=>m.role===r);

  const rr=r=>{const m=holder(r);return m?rb(m,r):""};
  const other=members.filter(m=>m.role&&!ROLES.includes(m.role));

    +res.map(([l,a])=>a.length?`<details class="ck"><summary>${ic("alert",16)}<span>${l}</span><b class="pill r">${a.length}</b></summary><div class="mn">${a.map(m=>`<button data-id="${m.id}">${esc(nm(m))}</button>`).join("")}</div></details>`
      :`<div class="ck ok">${ic("check",16)}<span>${l}</span><b class="pill g">Complete</b></div>`).join("");

  $("#v").innerHTML=`<div class="head"><div><h2>Dashboard</h2><small>${now.toLocaleDateString("en",{weekday:"long",month:"long",day:"numeric"})}<span class="chip"><i></i>${S.n}</span></small></div></div>

  ${box("Birthdays this month","cake","y",bdh)}

    (!st.g||m.group===st.g)&&(!st.s||m.status===st.s)&&(!st.r||m.role===st.r));

function openForm(id){
  const m=members.find(x=>x.id===id)||{};
  const field=([k,l,t])=>{
    let inp;
    if(Array.isArray(t)){const o=m[k]&&!t.includes(m[k])?[...t,m[k]]:t;
      inp=`<select name="${k}"><option value="">Not set</option>${o.map(x=>`<option${m[k]===x?" selected":""}>${esc(x)}</option>`).join("")}</select>`}
    else inp=`<input name="${k}" type="${t==="date"?"date":"text"}" value="${esc(m[k])}"${k==="lastName"||k==="firstName"?" required":""}>`;
    return (SEC[k]?`<div class="sh">${SEC[k]}</div>`:"")+`<label class="${t==="w"?"w":""}">${l}${inp}</label>`};
  $("#dlg").innerHTML=`<form id="mf"><div class="dh"><h2>${id?"Edit member":"New member"}</h2></div>
  <div class="bd"><div class="grid">${F.map(field).join("")}</div></div>
  <div class="foot">${id?`<button type="button" class="del" id="dl">${ic("trash",18)}Delete</button>`:""}
  <button type="button" id="cx">Cancel</button><button class="pri">Save member</button></div></form>`;
  $("#cx").onclick=()=>$("#dlg").close();
  if(id)$("#dl").onclick=async()=>{
    if(!confirm("Delete this member? This cannot be undone."))return;
    try{await deleteDoc(doc(db,"members",id));$("#dlg").close();if(view==="profile")go("members")}catch{alert("Could not delete. Check your connection and try again.")}};
  $("#mf").onsubmit=async e=>{e.preventDefault();
    const d={};F.forEach(([k])=>d[k]=e.target.elements[k].value.trim());
    const prev=d.role?members.filter(o=>o.id!==id&&o.role===d.role):[];
    if(prev.length){const names=prev.map(full).join(" and ");
      if(!confirm(`${names} currently ${prev.length>1?"hold":"holds"} the role of ${d.role}.\n\nIf you continue, ${names} will become ${prev.length>1?"regular members":"a regular member"} with no role. Continue?`))return}
    try{const b=writeBatch(db);
      prev.forEach(o=>b.update(doc(db,"members",o.id),{role:""}));
      b.set(id?doc(db,"members",id):doc(collection(db,"members")),d);
      await b.commit();$("#dlg").close()}
    catch{alert("Could not save. Check your connection and try again.")}};
  $("#dlg").showModal();
}

  <label class="w a">Event name<input name="title" placeholder="For example, Sunday Mass"></label>
  <label class="a">Date<input name="date" type="date" value="${today}"></label>
  <label>Group<select name="g">${opts(GROUPS,"All groups")}</select></label>
  <label>Status<select name="s">${opts(STATUS,"All statuses")}</select></label></div></div>
  <div class="foot"><button type="button" id="cx">Cancel</button><button class="pri">${ic("down",18)}Export</button></div></form>`;
  const f=$("#xf"),e=f.elements;
  const sync=()=>{const att=e.type.value==="att";f.querySelectorAll(".a").forEach(x=>x.hidden=!att);e.s.value=att?"Active":""};
  e.type.onchange=sync;sync();
  $("#cx").onclick=()=>$("#dlg").close();
  f.onsubmit=ev=>{ev.preventDefault();
    const a=members.filter(m=>(!e.g.value||m.group===e.g.value)&&(!e.s.value||m.status===e.s.value)).sort((x,y)=>nm(x).localeCompare(nm(y)));
    if(!a.length){alert("No members match these filters.");return}
    $("#dlg").close();
    e.type.value==="csv"?exportCsv(a):e.type.value==="pdf"?printDetails(a):printAtt(a,e.title.value.trim(),e.date.value)};
  $("#dlg").showModal();
}

async function printDoc(html,land){
  $("#pr").innerHTML=html;
  $("#pg").textContent=`@page{size:A4 ${land?"landscape":"portrait"};margin:12mm}`;
  await Promise.all([...document.images].filter(i=>$("#pr").contains(i)).map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
  const done=()=>{$("#pr").innerHTML="";removeEventListener("afterprint",done)};
  addEventListener("afterprint",done);
  setTimeout(()=>print(),100);
}
const phead=t=>`<div class="ph"><img src="logos/Origin.png" alt="" onerror="this.remove()"><div><h1>Ministry of Altar Servers</h1><p>St. Anthony Ma. Zaccaria Parish | Silangan San Mateo Rizal</p></div></div><h2>${t}</h2>`;

function printAtt(a,t,d){
  printDoc(`${phead("Attendance sheet")}<p class="pm"><b>Event:</b> ${esc(t)||"______________________"} &nbsp;&nbsp; <b>Date:</b> ${d?fmtL(d):"______________"}</p>
  <table class="pdt att"><thead><tr><th>No.</th><th>Full name</th><th>Time in</th><th>Time out</th><th>Signature</th></tr></thead>
  <tbody>${a.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(full(m))}</td><td></td><td></td><td></td></tr>`).join("")}</tbody></table>`,0);
}

function printDetails(a){
  const cols=F.slice(3);
  printDoc(`${phead("Member details")}<p class="pm">${a.length} members · Generated ${fmtL(today)}</p>
  <table class="pdt sm"><thead><tr><th>No.</th><th>Name</th>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead>
  <tbody>${a.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(nm(m))}</td>${cols.map(([k])=>`<td>${esc(m[k])}</td>`).join("")}</tr>`).join("")}</tbody></table>`,1);
}

function printProfile(m){
  const rows=[["Personal",[["Gender",m.gender],["Birthday",fmtL(m.birthday)],["Age",m.birthday?age(m.birthday):""],["Sacrament of Confirmation",m.confirmation]]],
   ["Contact",[["Contact number",m.contact],["Messenger",m.messenger],["Home address",m.address]]],
   ["Parent or guardian",[["Name",m.guardian],["Contact number",m.guardianContact]]],
   ["School",[["Level",m.schoolLevel],["School name",m.schoolName]]],
   ["Service",[["Role",m.role],["Group",m.group],["Status",m.status],["Started",fmtL(m.start)],["Ended",m.end?fmtL(m.end):m.start?"Ongoing":""],["Time in service",span(m.start,m.end)]]],
   ["Awards",AW.map(a=>[a.n,m[a.k]?"Given "+fmtL(m[a.k]):"Not yet received"])]];
  printDoc(`${phead("Member profile")}<h3 class="pn">${esc(full(m))}</h3>
  <p class="pm">${esc([m.role,m.group&&"Group "+m.group,m.status].filter(Boolean).join(" · "))}</p>
  <table class="pdt kv">${rows.map(([t,r])=>`<tr><th colspan="2">${t}</th></tr>`+r.map(([k,x])=>`<tr><td class="k">${k}</td><td>${esc(x)||"—"}</td></tr>`).join("")).join("")}</table>
  <p class="pm" style="margin-top:10px;color:#777">Printed ${fmtL(today)}</p>`,0);
}

function exportCsv(a){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[F.map(f=>q(f[1])).join(",")].concat(a.map(m=>F.map(f=>q(m[f[0]])).join(",")));
  const l=document.createElement("a");
  l.href=URL.createObjectURL(new Blob(["\ufeff"+rows.join("\r\n")],{type:"text/csv"}));
  l.download="members-"+today+".csv";l.click();
}
</script></body></html>
