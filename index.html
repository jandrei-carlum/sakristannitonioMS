<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Ministry of Altar Servers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--pur:#6a5a9c;--pd:#5d4d8c;--purt:#f1edf8;--gold:#d4b277;--goldt:#faf3e3;--grn:#4f8f69;--grnt:#e8f3ec;--red:#c4636b;--redt:#fbeced;--bg:#faf8fc;--ink:#2f2a3a;--mut:#7a7387;--line:#ece7f2;--season:#5fa57c;--sh:0 6px 20px #5d4d8c12;box-sizing:border-box}
*{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Nunito,"Segoe UI",system-ui,sans-serif;padding-bottom:80px}
h1,h2{font-family:Lora,Georgia,serif;margin:0;font-weight:600}
h3{display:flex;align-items:center;gap:.5rem;margin:0 0 .5rem;font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid var(--line);background:#fff;padding:.6rem 1rem;border-radius:12px;cursor:pointer;min-height:44px;text-decoration:none;color:inherit}
button:hover,.btn:hover{border-color:var(--gold)}
.pri{background:var(--pur);border-color:var(--pur);color:#fff}
.pri:hover{background:var(--pd);border-color:var(--pd)}
.dg{background:var(--red);border-color:var(--red);color:#fff}
.dg:hover{background:#a84f57;border-color:#a84f57}
.del{border-color:transparent;background:none;color:var(--red);margin-right:auto}
.lft{margin-right:auto}
.gh{background:none;border:0;min-height:32px;padding:.2rem .55rem;font-size:.8rem;color:var(--mut);border-radius:8px;gap:.3rem}
.gh:hover{color:var(--pd);background:var(--purt);border-color:transparent}
input,select{width:100%;min-height:44px;padding:.55rem .8rem;border:1px solid var(--line);border-radius:12px;background:#fff}
textarea{width:100%;min-height:84px;padding:.55rem .8rem;border:1px solid var(--line);border-radius:12px;background:#fff;resize:vertical}
:focus-visible{outline:3px solid #d4b27799;outline-offset:1px}
.top{position:relative;background:#fff;border-bottom:2px solid #ead9b4;box-shadow:0 2px 12px #5d4d8c0d}
.in{max-width:1000px;margin:auto;padding:.9rem 1rem .75rem;display:flex;align-items:center;gap:.8rem}
.logo{height:50px;width:auto;flex:none}
.brand{min-width:0}
.brand h1{font-size:clamp(.95rem,4.4vw,1.3rem);line-height:1.15;color:var(--pd)}
.brand p{margin:.2rem 0 0;font-size:.78rem;line-height:1.3;color:var(--mut)}
.brand p i{font-style:normal}
.top button{min-height:38px;padding:.3rem .8rem;font-size:.85rem}
.rb{margin:-.9rem 0 0 auto;align-self:flex-start;filter:drop-shadow(0 0 1px #c9a86a) drop-shadow(0 2px 3px #5d4d8c33)}
.rb i{display:grid;place-items:start center;padding-top:8px;width:26px;height:52px;background:var(--season);color:var(--gold);clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%)}
main{max-width:1000px;margin:auto;padding:1.25rem 1rem}
.ph2{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:flex-end;justify-content:space-between;margin-bottom:.9rem}
.ptl .eb{display:flex;align-items:center;gap:.5rem;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9a7a2f}
.ptl .eb::before{content:"";width:22px;height:2px;border-radius:2px;background:var(--gold)}
.ptl h2{font-size:2rem;line-height:1.1;margin:.25rem 0 .2rem}
.ptl p{margin:0;color:var(--mut);font-size:.92rem}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .6rem;color:var(--mut);font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.1rem .65rem;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:.78rem;color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--season);border:1px solid #0002}
.acts{display:flex;gap:.5rem}
.tools{display:flex;gap:.5rem;margin-bottom:.6rem}
.srch{position:relative;flex:1}
.srch svg{position:absolute;left:.8rem;top:12px;color:var(--mut)}
.srch input{padding-left:2.5rem}
#fb{font-style:normal;background:var(--pur);color:#fff;border-radius:99px;min-width:1.3rem;height:1.3rem;display:inline-grid;place-items:center;font-size:.75rem}
.fc{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem}
.fc:empty{display:none}
.chs{display:flex;flex-wrap:wrap;gap:.45rem}
.ch{min-height:38px;padding:.3rem .85rem;border-radius:99px;font-size:.88rem}
.ch.on{background:var(--purt);border-color:var(--pur);color:var(--pd);font-weight:700}
.fc .ch{min-height:32px;font-size:.8rem}
.fc .ch::after{content:" ×"}
.ri{display:inline-block;vertical-align:-2px;margin-right:.3rem;color:var(--pur)}
.ch .ri{color:inherit;margin-right:.35rem}
#list,#alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:.7rem}
.card{justify-content:flex-start;gap:.8rem;text-align:left;width:100%;border-radius:16px;padding:.85rem;box-shadow:var(--sh)}
.card>span:last-child{min-width:0;flex:1}
.am .pill{display:inline-block;margin-top:.3rem}
.av{position:relative;flex:none;width:46px;height:46px;border-radius:50%;background:var(--purt);color:var(--pur);display:grid;place-items:center;font:600 1.1rem Lora,Georgia,serif}
.av i{position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;background:var(--gold);color:#fff;font:700 .66rem Nunito,sans-serif;display:grid;place-items:center;border:2px solid #fff}
.av.rd{background:var(--redt);color:var(--red);width:40px;height:40px;font-size:1rem}
.card b,.card small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card b{font-weight:700}
.card small{color:var(--mut)}
.st{font-size:.8rem;color:var(--mut)}
.hint{display:block;margin-top:.25rem;color:var(--mut);font-size:.78rem}
.tag{display:inline-flex;align-items:center;gap:.3rem;font-size:.78rem;padding:.05rem .6rem;border-radius:99px;margin-left:.5rem}
.tag.ok{background:var(--grnt);color:#3f7a58}.tag.no{background:var(--goldt);color:#8a6a1f}
.pill{padding:.05rem .6rem;border-radius:99px;font-size:.78rem;font-weight:700;flex:none}
.pill.r{background:var(--redt);color:var(--red)}.pill.g{background:var(--grnt);color:#3f7a58}.pill.y{background:var(--goldt);color:#8a6a1f}.pill.n{background:var(--purt);color:var(--pd)}
.none{color:var(--mut);margin:0;padding:.3rem 0}
.wel{display:grid;gap:.9rem;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:1rem 1.1rem;margin-bottom:.75rem}
.wm .wh{font:600 1.5rem Lora,Georgia,serif;color:var(--pd)}
.wm p{margin:.2rem 0 0;color:var(--mut)}
.vs{margin:0;padding-left:.9rem;border-left:3px solid var(--gold)}
.vs figcaption{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9a7a2f;margin-bottom:.25rem}
.vs blockquote{margin:0;font:italic 500 1rem/1.5 Lora,Georgia,serif}
.vs cite{display:block;margin-top:.3rem;font-style:normal;font-size:.8rem;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:.75rem}
.stat,.box,.hero,.strip,.oth{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.stat{display:flex;align-items:center;gap:.8rem;padding:1rem}
button.stat{width:100%;justify-content:flex-start;text-align:left;min-height:0;cursor:pointer}
button.stat:hover{border-color:var(--gold)}
.stat .cv{margin-left:auto;color:var(--mut);transition:transform .2s;display:grid}
.stat[aria-expanded=true] .cv{transform:rotate(180deg)}
.stat div{min-width:0}
.stat b{display:block;font:600 1.8rem/1 Lora,Georgia,serif}
.stat div span{color:var(--mut);font-size:.82rem}
.oth{padding:.85rem 1rem;margin-bottom:.75rem}
.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.4rem}
.oc{display:flex;align-items:center;gap:.5rem;padding:.45rem .65rem;border:1px solid var(--line);border-radius:12px;font-size:.85rem}
.oc b{margin-left:auto;font-weight:700}
.oc.z{opacity:.5}
.box{padding:1rem}
.box.rbx{border-top:3px solid var(--red)}
.tl{margin-left:auto}
.ic{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;flex:none}
.stat .ic{width:44px;height:44px;border-radius:14px}
.box h3 .ic{width:28px;height:28px;border-radius:9px}
.p{background:var(--purt);color:var(--pur)}.g{background:var(--grnt);color:var(--grn)}.y{background:var(--goldt);color:#9a7a2f}.r{background:var(--redt);color:var(--red)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:.75rem}
button.li{width:100%;justify-content:flex-start;text-align:left;gap:.75rem;border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:.5rem 0;min-height:56px}
.lt{flex:1;min-width:0}
.lt b{display:block;font-weight:700;overflow-wrap:anywhere}
.lt small{display:block;color:var(--mut)}
.lt small.rl{color:var(--red);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.db{flex:none;width:44px;height:48px;border-radius:12px;background:var(--goldt);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.db b{font:600 1.15rem Lora,Georgia,serif;color:#8a6a1f}
.db small{font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;color:#9a7a2f;margin-top:3px}
.bl button.li{min-height:44px;padding:.3rem 0;gap:.6rem}
.bl .db{width:36px;height:38px;border-radius:10px}
.bl .db b{font-size:1rem}
.bl .db small{font-size:.55rem;margin-top:2px}
.bl .lt b{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .lt small{font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{width:100%;margin-top:.4rem;min-height:40px;font-size:.85rem;color:var(--pd)}
.sh2{margin:.6rem 0 0;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.vac{margin:.5rem 0 0;padding-top:.5rem;border-top:1px dashed var(--line);font-size:.82rem;color:var(--mut)}
.lg{display:flex;flex-wrap:wrap;gap:.1rem .7rem;font-size:.74rem;color:var(--mut);margin:.1rem 0 .4rem}
.lg span{display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap}
.dt{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}
button.gr{display:grid;grid-template-columns:32px 1fr auto;gap:.7rem;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:.5rem .2rem;min-height:0}
button.gr:hover{background:var(--bg)}
.gb{width:32px;height:32px;border-radius:50%;background:var(--goldt);color:#8a6a1f;border:1px solid var(--gold);display:grid;place-items:center;font:700 .9rem Nunito,sans-serif}
.gm{display:block;min-width:0}
.gl{display:flex;justify-content:space-between;align-items:baseline;gap:.1rem .5rem;flex-wrap:wrap;font-size:.85rem;color:var(--mut)}
.gl em{font-style:normal;margin-left:.4rem;color:#9a7a2f;font-size:.75rem;font-weight:700}
.sb2{display:flex;flex-wrap:wrap;gap:.1rem .55rem;font-size:.74rem}
.sb2 span{white-space:nowrap;display:inline-flex;align-items:center;gap:.25rem;font-weight:700;color:var(--ink)}
.sg{display:flex;height:10px;margin-top:.3rem;border-radius:9px;overflow:hidden;background:var(--purt)}
.sg i{display:block;min-width:3px}
.gt{height:10px;margin-top:.25rem;background:var(--purt);border-radius:9px;overflow:hidden}
.gt i{display:block;height:100%;background:var(--pur);border-radius:9px}
.gc{min-width:2.6rem;text-align:center;padding:.15rem .65rem;border-radius:99px;background:var(--purt);color:var(--pd);font-weight:700}
.cp{display:flex;align-items:center;gap:.6rem}
.cp .gt{flex:1;margin:0}
.cp b{color:var(--pd)}
.cps{margin:.2rem 0 .3rem;font-size:.82rem;color:var(--mut)}
.ck{border-top:1px solid var(--line)}
.ck summary,.ck.ok{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;cursor:pointer;list-style:none}
.ck.ok{cursor:default}
.ck summary::-webkit-details-marker{display:none}
.ck svg{flex:none;color:var(--red)}
.ck.ok svg{color:var(--grn)}
.ck span{flex:1;min-width:0}
.mn{display:flex;flex-wrap:wrap;gap:.35rem;padding:0 0 .6rem 1.7rem}
.mn button{min-height:32px;padding:.15rem .7rem;font-size:.82rem;border-radius:99px}
.back{background:none;border:0;padding:.3rem .2rem;min-height:38px;color:var(--pur);font-weight:700;margin-bottom:.4rem}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;border-top:4px solid var(--gold);padding:1.25rem;margin-bottom:.75rem}
.av.big{width:84px;height:84px;font-size:2.1rem;border:3px solid var(--gold)}
.hn{flex:1;min-width:0;flex-basis:200px}
.hn h2{font-size:clamp(1.4rem,5vw,1.9rem);line-height:1.15;overflow-wrap:anywhere}
.hn p{margin:.25rem 0 .4rem;color:var(--mut);overflow-wrap:anywhere}
.strip{display:grid;grid-template-columns:1fr 1.9fr 1fr;margin-bottom:.75rem}
.cell{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.3rem;padding:1rem .4rem;min-width:0}
.cell+.cell{border-left:1px solid var(--line)}
.cell b{font:600 clamp(1.1rem,4.6vw,1.6rem)/1.15 Lora,Georgia,serif}
.cell span:last-child{color:var(--mut);font-size:.8rem}
.aw{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.75rem}
.medal{display:flex;align-items:center;gap:.9rem;padding:.9rem;border-radius:16px;border:1px solid var(--gold);background:var(--goldt);min-width:0}
.medal.m2{border-color:#b9aee0;background:var(--purt)}
.medal.off{border:1px dashed #d9d2e2;background:#fff;color:var(--mut)}
.mdl{flex:none;display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:#fff;border:2px solid var(--gold);color:#9a7a2f;box-shadow:0 0 0 4px #d4b27733}
.m2 .mdl{border-color:var(--pur);color:var(--pur);box-shadow:0 0 0 4px #6a5a9c22}
.off .mdl{border:2px dashed #cfc7da;color:#b8aec4;box-shadow:none}
.medal b{display:block;overflow-wrap:anywhere}
.medal small{display:block;color:var(--mut)}
.medal .dt2{display:inline-block;margin-top:.25rem;font-size:.8rem;font-weight:700;color:#8a6a1f}
.m2 .dt2{color:var(--pd)}
.f{padding:.5rem 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.f small{display:block;color:var(--mut)}
.f a{color:var(--pur);font-weight:700;text-decoration:none}
.na{color:#aaa1b4}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;flex-direction:column;gap:2px;border:0;border-radius:0;background:none;min-height:58px;color:var(--mut);font-weight:700;font-size:.78rem}
nav button.on{color:var(--pur);box-shadow:inset 0 3px var(--gold)}
dialog{border:0;border-radius:20px;padding:0;width:min(660px,96vw);max-height:92vh;overflow:hidden}
dialog::backdrop{background:#2a1f4599}
dialog form,.fm{display:flex;flex-direction:column;max-height:92vh}
.dh{padding:1.1rem 3.6rem .6rem 1.25rem;border-bottom:2px solid var(--gold)}
.x{position:absolute;top:.65rem;right:.65rem;z-index:3;width:38px;height:38px;min-height:38px;padding:0;border:0;border-radius:50%;background:var(--purt);color:var(--pd)}
.x:hover{background:var(--goldt);border-color:transparent}
.ip{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.6rem 0 .8rem}
.ip div{border:1px solid var(--line);border-radius:14px;padding:.6rem .3rem;text-align:center}
.ip b{display:block;font:600 1.6rem/1.1 Lora,Georgia,serif}
.ip span{font-size:.76rem;color:var(--mut)}
.imp{margin-top:.45rem;font-size:.78rem;min-height:30px}
.dh h2{font-size:1.6rem;overflow-wrap:anywhere}
.bd{padding:1rem 1.25rem;overflow:auto;flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.grid label{font-size:.82rem;color:var(--mut)}
.grid .w{grid-column:1/-1}
.sh{grid-column:1/-1;margin:.6rem 0 -.2rem;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9a7a2f}
.sh:first-child{margin-top:0}
.bd>.sh{margin:1rem 0 .5rem}
.bd>.sh:first-child{margin-top:0}
.foot{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:flex-end;padding:.8rem 1.25rem calc(.8rem + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
.cf{width:min(420px,92vw);margin:auto;border-radius:22px}
.cfb{padding:1.4rem 1.4rem 1.2rem;text-align:center}
.cfi{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;margin:0 auto .8rem}
.cfi.r{background:var(--redt);color:var(--red)}.cfi.p{background:var(--purt);color:var(--pur)}.cfi.y{background:var(--goldt);color:#9a7a2f}
.cfb h2{font-size:1.45rem;line-height:1.2;overflow-wrap:anywhere}
.cft{margin-top:.6rem;color:var(--mut);font-size:.92rem}
.cft p{margin:.5rem 0 0}
.cft b{color:var(--ink)}
.nl{max-height:42vh;overflow:auto;margin-top:.7rem;text-align:left}
.cfn{display:flex;align-items:center;gap:.7rem;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:.6rem .8rem}
.cfn .av{width:42px;height:42px;flex:none}
.cfn span:last-child{min-width:0;overflow-wrap:anywhere}
.cfh{font-size:.82rem;color:var(--mut)}
.cfa{display:flex;gap:.6rem;margin-top:1.1rem}
.cfa button{flex:1}
.ld{width:auto;max-height:none;margin:auto;border-radius:22px;padding:1.6rem 2.2rem;text-align:center;box-shadow:0 20px 50px #2a1f4566}
.ld::backdrop{background:#2a1f45b3;backdrop-filter:blur(2px)}
.ld p{margin:.8rem 0 0;font-weight:700;color:var(--pd)}
.spin{display:inline-block;width:44px;height:44px;border:4px solid var(--purt);border-top-color:var(--pur);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ts{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--pd);color:#fff;padding:.6rem 1.1rem;border-radius:99px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9;box-shadow:var(--sh)}
.ts.show{opacity:1;transform:translate(-50%,0)}
.lw{padding:6vh 1rem}
.login{max-width:400px;margin:auto;padding:1.75rem;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh)}
.login .ic{margin-bottom:.8rem;width:44px;height:44px}
.login h2{font-size:1.8rem}
.login p{color:var(--mut);margin:.3rem 0 0}
.login label{display:block;margin-top:1rem;color:var(--mut);font-size:.85rem}
.login label input{margin-top:.25rem}
.login button.pri{width:100%;margin-top:.5rem}
.pw{position:relative;display:block}
.pw input{padding-right:3rem}
.pw button{position:absolute;right:2px;top:2px;min-height:40px;width:40px;padding:0;border:0;background:none;color:var(--mut)}
.err{color:var(--red);min-height:1.5em;margin:.75rem 0 0!important;font-size:.9rem}
.nt2{background:var(--goldt);color:#8a6a1f!important;border-radius:12px;padding:.6rem .8rem;margin:.9rem 0 0!important;font-size:.88rem}
.login .hint{text-align:center;margin-top:.8rem}
#pr{display:none;font-family:Nunito,Arial,sans-serif;color:#222}
.ph{display:flex;align-items:center;gap:12px;border-bottom:2px solid #d4b277;padding-bottom:8px}
.ph img{height:56px}
.ph h1{font-size:18pt;line-height:1.1;color:#5d4d8c}
.ph p{margin:2px 0 0;font-size:9pt;color:#555}
#pr h2{font-size:14pt;margin:12px 0 4px}
#pr .pn{font:600 20pt Lora,Georgia,serif;margin:12px 0 2px}
.pm{margin:0 0 8px;font-size:10pt}
.pdt{width:100%;border-collapse:collapse;font-size:10pt}
.pdt th,.pdt td{border:1px solid #888;padding:5px 6px;text-align:left;vertical-align:top;overflow-wrap:break-word}
.pdt th{background:#efeaf6;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ---------- Pop-ups: every window gets a close icon (top right) and closes when you tap outside it ---------- */
const XB=`<button type="button" class="x" aria-label="Close">${ic("x",18)}</button>`;
function dismiss(d){const ev=new Event("cancel",{cancelable:true});d.dispatchEvent(ev);if(!ev.defaultPrevented&&d.open)d.close()}
["dlg","cf","nt"].forEach(id=>{
  const d=document.getElementById(id);let down=null;
  /* Windows are re-filled often, so the close icon is added again whenever the content changes. */
  new MutationObserver(()=>{if(!d.querySelector(":scope>.x"))d.insertAdjacentHTML("beforeend",XB)}).observe(d,{childList:true});
  d.addEventListener("pointerdown",e=>{down=e.target});
  d.addEventListener("click",e=>{
    const b=e.target.closest(".x");
    let out=false;
    if(e.target===d&&down===d){const r=d.getBoundingClientRect();out=e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom}
    if((b&&d.contains(b))||out)dismiss(d);
  });
});

/* ---------- Security: session-only login, idle timeout, re-authentication ---------- */
const IDLE_MS=10*60e3,WARN_MS=60e3,MAX_MS=8*60*60e3,REAUTH_MS=5*60e3,MAXTRY=5,LOCK_MS=5*60e3;
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{sessionStorage.setItem(k,String(v))}catch{}},del:k=>{try{sessionStorage.removeItem(k)}catch{}}};
/* The login lives in this tab only. Closing the tab or browser signs the user out. */
const ready=setPersistence(auth,browserSessionPersistence).catch(()=>{});
let tick=null,lastAct=Date.now(),T0=0,reAt=0,warnOn=false,locking=false,fresh=false;
const ACT=["pointerdown","keydown","touchstart","wheel","scroll"];
function touch(){if(warnOn)return;const n=Date.now();if(n-lastAct>1500){lastAct=n;ss.set("moas_la",n)}}
function closeAll(){document.querySelectorAll("dialog").forEach(d=>{if(d.open)d.close()})}
function watch(){
  stopWatch();
  T0=+ss.get("moas_t0")||Date.now();ss.set("moas_t0",T0);
  lastAct=+ss.get("moas_la")||Date.now();
  ACT.forEach(e=>addEventListener(e,touch,{passive:true,capture:true}));
  document.addEventListener("visibilitychange",check);
  tick=setInterval(check,1000);check();
}
function stopWatch(){clearInterval(tick);tick=null;ACT.forEach(e=>removeEventListener(e,touch,true));document.removeEventListener("visibilitychange",check);hideWarn()}
function check(){
  const n=Date.now(),idle=n-lastAct;
  if(n-T0>=MAX_MS)return lock("For your security, your session expired. Please sign in again.");
  if(idle>=IDLE_MS+WARN_MS)return lock("You were signed out after 10 minutes of inactivity.");
  idle>=IDLE_MS?showWarn(Math.ceil((IDLE_MS+WARN_MS-idle)/1000)):hideWarn();
}
function showWarn(s){
  const d=$("#wd");
  if(!warnOn){warnOn=true;
    d.innerHTML=`<div class="cfb"><span class="cfi y">${ic("clock",26)}</span><h2>Still There?</h2><div class="cft"><p>For your security, you will be signed out in <b id="wc"></b> seconds.</p></div><div class="cfa"><button type="button" id="wo">Sign Out</button><button type="button" class="pri" id="wk">Stay Signed In</button></div></div>`;
    $("#wo").onclick=()=>lock("You have been signed out.");

    d.oncancel=e=>e.preventDefault();
    d.showModal();

}
function hideWarn(){warnOn=false;const d=$("#wd");if(d&&d.open)d.close()}

/* Ask for the password again before sensitive actions (valid for 5 minutes). */
function reauth(){
  if(!auth.currentUser)return Promise.resolve(false);
  if(Date.now()-reAt<REAUTH_MS)return Promise.resolve(true);
  return new Promise(res=>{
    const d=$("#cf");
    d.innerHTML=`<form class="cfb" id="raf"><span class="cfi p">${ic("lock",26)}</span><h2>Confirm It's You</h2><div class="cft"><p>Enter your password to continue with this sensitive action.</p></div>

    <div class="cfa"><button type="button" id="rac">Cancel</button><button class="pri" id="rak">Confirm</button></div></form>`;
    let done=false;const fin=v=>{if(done)return;done=true;d.close();res(v)};
    d.oncancel=()=>{done=true;res(false)};
    $("#rac").onclick=()=>fin(false);

      catch(x){$("#rae").textContent=x.message==="timeout"?"No connection. Please try again.":x.code==="auth/too-many-requests"?"Too many attempts. Please wait a few minutes.":"Wrong password. Please try again.";b.disabled=false;$("#rap").select()}};
    d.showModal();$("#rap").focus();
  });
}

onAuthStateChanged(auth,u=>{

  $("#lf").onsubmit=async e=>{e.preventDefault();const b=$("#sb"),er=$("#err");er.style.color="";er.textContent="";
    const wait=(+ss.get("moas_u")||0)-Date.now();

    b.disabled=true;b.textContent="Signing In…";

      :`<div class="ck ok">${ic("check",16)}<span>${l}</span><b class="pill g">Complete</b></div>`).join("");

  const openA=acts.filter(a=>a.status==="Scheduled"&&a.date).sort(ASC),lateA=openA.filter(late),nextA=openA.filter(a=>!late(a));
  const arow=a=>{const k=dd(a.date);return `<button class="li" data-aid="${a.id}">${dblk(a.date)}<span class="lt"><b>${esc(a.title)}</b><small>${asub(a)}</small></span><span class="pill ${k<0?"r":k<=NOTIFY_DAYS?"y":"n"}">${k<0?"Needs Update":whenA(k)}</span></button>`};
  const aShow=[...lateA,...nextA].slice(0,5);
  const ah=actErr?'<p class="none">Could not load activities. In Firebase, allow signed-in users to read and write the “activities” collection in the Firestore rules.</p>'
    :(aShow.length?`${lateA.length?`<p class="cps" style="margin:0 0 .3rem;color:var(--red)">${lateA.length} past activit${lateA.length>1?"ies need":"y needs"} a Done or Not Done update.</p>`:""}<div class="bl">${aShow.map(arow).join("")}</div>`:`<p class="none">No upcoming activities. Schedule one from the Activities tab.</p>`)
      +`<button class="more" id="gA">${ic("expand",16)} Open Activities</button>`;
  const atail=lateA.length?`<span class="pill r" title="Past activities that need an update">${lateA.length}</span>`:nextA.length?`<span class="pill n" title="Upcoming activities">${nextA.length}</span>`:"";

  $("#v").innerHTML=`<div class="ph2 dsh"><div class="ptl"><span class="eb">Ministry Overview</span><h2>Dashboard</h2><p>Membership, activities, birthdays, and records at a glance.</p></div><div class="pmeta">${now.toLocaleDateString("en",{weekday:"long",month:"long",day:"numeric"})}<span class="chip"><i></i>${S.n}</span><button class="gh" id="rpt" title="Create a ministry report for the parish priest" aria-label="Create ministry report">${ic("doc",15)}Report</button></div></div>
  ${wel}
  <div class="stats">${stat(members.length,"Total Members","users","p")}${stat(A,"Active","check","g")}${stat(I,"Inactive","pause","y")}${othT}</div>
  ${othp}
  <div class="cols">
  ${box("Upcoming Activities","cal","g",ah,"",atail)}
  ${box("Members per Group","users","p",grp)}
  ${box("Birthdays in the Next 2 Weeks","cake","y",bdh,"",bdc)}
  ${box("Officers and Leaders","cross","r",offh+(vac.length&&filled?`<p class="vac">Vacant: ${vac.join(", ")}</p>`:""),"rbx")}

  </div>`;
}

function openForm(id){
  const m=members.find(x=>x.id===id)||{};
  const field=([k,l,t])=>{
    let inp;
    if(Array.isArray(t)){const o=m[k]&&!t.includes(m[k])?[...t,m[k]]:t,lb=k==="status"?sl:x=>x;
      inp=`<select name="${k}"><option value="">Not Set</option>${o.map(x=>`<option value="${esc(x)}"${m[k]===x?" selected":""}>${esc(lb(x))}</option>`).join("")}</select>`
        +(k==="status"?`<small class="hint" id="sth">${esc(SD[m.status]||"")}</small>`:"")}
    else if(PH.includes(k))inp=`<input name="${k}" type="tel" inputmode="numeric" maxlength="11" pattern="09[0-9]{9}" placeholder="09XXXXXXXXX" title="11 digits starting with 09, like 09171234567" value="${esc(m[k])}">`;
    else inp=`<input name="${k}" type="${t==="date"?"date":"text"}" value="${esc(m[k])}"${k==="lastName"||k==="firstName"?" required":""}>`;
    return (SEC[k]?`<div class="sh">${SEC[k]}</div>`:"")+`<label class="${t==="w"?"w":""}">${l}${inp}</label>`};
  $("#dlg").innerHTML=`<form id="mf"><div class="dh"><h2>${id?"Edit Member":"New Member"}</h2></div>
  <div class="bd"><div class="grid">${F.map(field).join("")}</div></div>
  <div class="foot">${id?`<button type="button" class="del" id="dl">${ic("trash",18)}Delete</button>`:""}
  <button type="button" id="cx">Cancel</button><button class="pri">Save Member</button></div></form>`;
  $("#mf").elements.status.onchange=e=>{$("#sth").textContent=SD[e.target.value]||""};
  {const f=$("#mf").elements,hn=document.createElement("small");hn.className="hint";f.role.parentNode.appendChild(hn);
   f.role.onchange=()=>{const x=/^Group (\d) Lead$/.exec(f.role.value);hn.textContent="";if(x){f.group.value=x[1];hn.textContent=`Group set to ${x[1]}: a ${f.role.value} must belong to that group.`}};
   f.group.onchange=()=>{const x=/^Group (\d) Lead$/.exec(f.role.value);hn.textContent="";if(x&&f.group.value!==x[1]){f.role.value="";hn.textContent=`Role removed: only a member of Group ${x[1]} can be its lead.`}}}
  PH.forEach(k=>{const i=$("#mf").elements[k];
    const chk=()=>{i.value=i.value.replace(/\D/g,"").slice(0,11);i.setCustomValidity(i.value&&!/^09\d{9}$/.test(i.value)?"Enter 11 digits starting with 09, like 09171234567.":"")};
    i.addEventListener("input",chk);chk()});
  $("#cx").onclick=()=>$("#dlg").close();
  if(id)$("#dl").onclick=async()=>{
    const sub=[m.role,m.group&&"Group "+m.group,m.status&&sl(m.status)].filter(Boolean).join(" · ")||"Member record";
    const ok=await ask({icon:"trash",danger:1,title:`Delete ${esc(full(m))}?`,ok:"Delete Member",
      body:`<div class="cfn"><span class="av">${ini(m)}</span><span><b>${esc(full(m))}</b><br><small>${esc(sub)}</small></span></div>
      <p>This permanently removes the member and all of their records, including awards. This cannot be undone.</p>
      <p class="cfh">If this member has left the ministry, consider changing their status instead, such as Transferred or Graduated.</p>`});
    if(!ok||!await reauth())return;
    busy("Deleting member…");
    try{const b=writeBatch(db);b.delete(doc(db,"members",id));logH(b,"Deleted","member",id,full(m),diff(m,{},F.map(f=>f[0])));await withTimeout(b.commit(),20000);busyEnd();$("#dlg").close();toast("Member deleted.");if(view==="profile")go("members")}
    catch(x){busyEnd();alert(x.message==="timeout"?slowMsg:"Could not delete. Check your connection and try again.")}};
  $("#mf").onsubmit=async e=>{e.preventDefault();
    const d={};F.forEach(([k])=>d[k]=e.target.elements[k].value.trim());
    const lm=/^Group (\d) Lead$/.exec(d.role);let note="";
    if(lm&&id&&m.role===d.role&&m.group!==d.group){d.role="";note=`The ${m.role} role was removed because the member moved to ${d.group?"Group "+d.group:"no group"}.`}
    else if(lm&&d.group!==lm[1]){d.group=lm[1];note=`Group was set to ${lm[1]} because a ${d.role} must belong to Group ${lm[1]}.`}
    const prev=d.role?members.filter(o=>o.id!==id&&o.role===d.role):[];
    if(prev.length){const names=prev.map(full).join(" and "),many=prev.length>1;
      const ok=await ask({icon:"shield",title:"Reassign This Role?",ok:"Reassign Role",
        body:`<p><b>${esc(names)}</b> currently ${many?"hold":"holds"} the role of <b>${esc(d.role)}</b>.</p><p>If you continue, ${many?"they":"this member"} will become ${many?"regular members":"a regular member"} with no role.</p>`});
      if(!ok)return}
    busy(id?"Saving changes…":"Adding member…");
    try{const b=writeBatch(db);
      prev.forEach(o=>{b.update(doc(db,"members",o.id),{role:""});logH(b,"Role removed","member",o.id,full(o),[{f:"Role",from:o.role,to:""}])});
      const ref=id?doc(db,"members",id):doc(collection(db,"members")),ch=id?diff(m,d,F.map(f=>f[0])):[];
      b.set(ref,d);
      if(!id||ch.length)logH(b,id?"Edited":"Added","member",ref.id,[d.firstName,d.lastName].join(" "),ch);
      await withTimeout(b.commit(),20000);busyEnd();$("#dlg").close();toast(note||(id?"Changes saved.":"Member added."))}
    catch(x){busyEnd();alert(x.message==="timeout"?slowMsg:"Could not save. Check your connection and try again.")}};
  $("#dlg").showModal();
}

  const q=sa.q.trim().toLowerCase();
  const cnt={all:acts.length,up:acts.filter(a=>a.status==="Scheduled"&&!late(a)).length,late:acts.filter(late).length,Done:acts.filter(a=>a.status==="Done").length,"Not Done":acts.filter(a=>a.status==="Not Done").length};

    `<p class="none">${acts.length?"No activities match your search or filter.":"No activities yet. Select Add Activity to schedule one."}</p>`;
}

function openAct(id){

function parseCsv(t){
  t=t.replace(/^﻿/,"");
  const first=t.split(/\r?\n/,1)[0]||"",cnt=c=>first.split(c).length-1;
  const sep=cnt("\t")>cnt(",")&&cnt("\t")>=cnt(";")?"\t":cnt(";")>cnt(",")?";":",";
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===sep){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);f="";rows.push(row);row=[]}
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
function pdate(v){
  let x="";
  if(v instanceof Date)x=isNaN(v)?"":iso(new Date(v.getTime()+12*36e5));
  else if(typeof v==="number")x=v>1&&v<80000?new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10):"";
  else x=dt(String(v).trim());
  const y=+x.slice(0,4),t=new Date(x+"T00:00:00");
  return y>=1900&&y<=2100&&!isNaN(t)&&iso(t)===x?x:"";
}
/* Accepts 09XXXXXXXXX, +63 9XX XXX XXXX, or 9XXXXXXXXX (Excel often drops the leading 0). Returns 09XXXXXXXXX or "". */
function fixPh(v){
  let x=String(v).replace(/[\s\-().]/g,"");
  if(/^\+?63\d{10}$/.test(x))x="0"+x.replace(/^\+?63/,"");
  if(/^9\d{9}$/.test(x))x="0"+x;
  return /^09\d{9}$/.test(x)?x:"";
}
async function readTable(file){
  if(file.size>5*1024*1024)throw new Error("This file is larger than 5 MB.");
  if(/\.(csv|txt)$/i.test(file.name))return parseCsv(await file.text());
  throw new Error("Please choose a .csv file. In Excel, use Save As and pick CSV.");
}

function buildImport(table){
  const rows=table.map((r,i)=>({r,n:i+1})).filter(x=>x.r.some(c=>String(c??"").trim()!==""));
  if(!rows.length)throw new Error("This file is empty.");
  const head=rows[0].r.map(h=>HMAP[key(h)]||null);
  if(!head.includes("lastName")||!head.includes("firstName"))throw new Error("Could not find the “Last Name” and “First Name” columns in the first row. Check your headings, or download the template.");
  if(rows.length>2001)throw new Error("This file has more than 2,000 rows. Please split it into smaller files.");
  const label=k=>F.find(f=>f[0]===k)[1];
  const exist=new Set(members.map(m=>key(m.lastName)+"|"+key(m.firstName)+"|"+m.birthday));
  const holders=new Map(members.filter(m=>m.role).map(m=>[m.role,full(m)]));
  const seen=new Set(),out={ready:[],skipped:[],bad:[],notes:[]};
  rows.slice(1).forEach(({r,n})=>{
    const raw={};head.forEach((k,i)=>{if(k&&raw[k]===undefined)raw[k]=r[i]});
    const s=k=>{const v=raw[k];return v==null||v instanceof Date?"":String(v).trim()};
    const errs=[],d={};F.forEach(([k])=>d[k]="");
    ["lastName","firstName","middleName","guardian","schoolName","address"].forEach(k=>d[k]=tc(s(k)));
    d.messenger=s("messenger");
    d.schoolLevel=canon(s("schoolLevel"),SCHOOL);
    DATEF.forEach(k=>{const v=raw[k];if(v==null||v==="")return;const x=pdate(v);x?d[k]=x:errs.push(`${label(k)} is not a valid date (use YYYY-MM-DD).`)});
    PH.forEach(k=>{const v=s(k);if(!v)return;const x=fixPh(v);x?d[k]=x:errs.push(`${label(k)} must be 09XXXXXXXXX (11 digits).`)});
    [["status",STATUS],["role",ROLES]].forEach(([k,list])=>{const v=s(k);if(!v)return;const c=canon(v,list);list.includes(c)?d[k]=c:errs.push(`${label(k)} “${v}” is not one of the options.`)});
    const cv=key(s("confirmation"));
    if(cv){d.confirmation=["confirmed","yes","y"].includes(cv)?"Confirmed":["notyetconfirmed","notconfirmed","no","n"].includes(cv)?"Not Yet Confirmed":"";if(!d.confirmation)errs.push("Confirmation must be Confirmed or Not Yet Confirmed.")}
    const gv=key(s("gender"));
    if(gv){d.gender=["f","female"].includes(gv)?"Female":["m","male"].includes(gv)?"Male":"";if(!d.gender)errs.push("Gender must be Female or Male.")}
    const g=s("group").replace(/^group\s*/i,"");
    if(g){GROUPS.includes(g)?d.group=g:errs.push("Group must be 1 to 5.")}
    const nm2=[d.lastName,d.firstName].filter(Boolean).join(", ")||"(no name)";
    if(!d.lastName||!d.firstName){errs.unshift("Last Name and First Name are required.");out.bad.push({n,name:nm2,msgs:errs});return}
    const dk=key(d.lastName)+"|"+key(d.firstName)+"|"+d.birthday;
    if(exist.has(dk)){out.skipped.push({n,name:nm2,why:"Already in the system"});return}
    if(seen.has(dk)){out.skipped.push({n,name:nm2,why:"Repeated in this file"});return}
    if(errs.length){out.bad.push({n,name:nm2,msgs:errs});return}
    seen.add(dk);
    if(d.role){
      if(holders.has(d.role)){out.notes.push({n,name:nm2,msg:`Role “${d.role}” is already held by ${holders.get(d.role)}, so it was left blank.`});d.role=""}
      else{holders.set(d.role,"another row in this file");const lmi=/^Group (\d) Lead$/.exec(d.role);if(lmi&&d.group!==lmi[1]){out.notes.push({n,name:nm2,msg:`Group set to ${lmi[1]} to match the role “${d.role}”.`});d.group=lmi[1]}}
    }
    out.ready.push({n,name:nm2,data:d});
  });
  return out;
}

function openImport(msg){
  $("#dlg").innerHTML=`<div class="fm"><div class="dh"><h2>Import Members</h2><small class="hint">For moving records from another file. Accepts CSV files. In Excel, use Save As, then CSV.</small></div>
  <div class="bd"><p class="cps" style="margin-top:0">The first row must be column headings. Only <b>Last Name</b> and <b>First Name</b> are required. You will see a preview first, and nothing is saved until you confirm.</p>
  <ul class="cps" style="padding-left:1.1rem;margin:.3rem 0">
  <li>Contact numbers: <b>09XXXXXXXXX</b></li>
  <li>Dates: <b>YYYY-MM-DD</b>, for example 2010-03-15</li>
  <li>Status, role, group, gender, and confirmation must match the options in the app</li>
  <li>A member already in the system (same name and birthday) is skipped</li></ul>
  <p class="err" id="ime" role="alert">${esc(msg||"")}</p></div>
  <div class="foot"><button type="button" class="lft" id="imt">Download Template</button><button type="button" class="pri" id="imc">${ic("impo",18)}Choose File</button></div></div>`;
  $("#imt").onclick=()=>{
    const q=v=>`"${String(v).replace(/"/g,'""')}"`;
    const l=document.createElement("a");
    l.href=URL.createObjectURL(new Blob(["﻿"+F.map(f=>q(f[1])).join(",")+"\r\n"],{type:"text/csv"}));
    l.download="members-import-template.csv";l.click();
  };
  $("#imc").onclick=()=>{
    const inp=document.createElement("input");inp.type="file";inp.accept=".csv,.txt,text/csv";
    inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
      busy("Reading file…");
      try{const res=buildImport(await readTable(f));busyEnd();previewImport(res,f.name)}
      catch(x){busyEnd();openImport(x.message||"Could not read this file.")}};
    inp.click();
  };
  if(!$("#dlg").open)$("#dlg").showModal();
}

function previewImport(res,fname){
  const{ready,skipped,bad,notes}=res,n=ready.length;
  const more=(a,max)=>a.length>max?`<p class="cps" style="margin:.2rem 0">…and ${a.length-max} more.</p>`:"";
  const sec=(title,pill,cls,icon,a,fn,open)=>a.length?`<details class="ck"${open?" open":""}><summary><span style="flex:none;display:flex;color:${cls==="g"?"var(--grn)":"var(--red)"}">${ic(icon,16)}</span><span>${title}</span><b class="pill ${pill}">${a.length}</b></summary><div style="padding:0 0 .6rem 1.7rem">${a.slice(0,100).map(fn).join("")}${more(a,100)}</div></details>`:"";
  const line=(x,t)=>`<p class="cps" style="margin:.15rem 0">Row ${x.n} · <b>${esc(x.name)}</b>${t?" — "+esc(t):""}</p>`;
  const needS=ready.some(r=>!r.data.status);
  $("#dlg").innerHTML=`<div class="fm"><div class="dh"><h2>Import Preview</h2><small class="hint">${esc(fname)}</small></div>
  <div class="bd"><div class="ip"><div><b style="color:var(--grn)">${n}</b><span>Ready to import</span></div><div><b style="color:#9a7a2f">${skipped.length}</b><span>Skipped</span></div><div><b style="color:var(--red)">${bad.length}</b><span>Have problems</span></div></div>
  ${bad.length?`<p class="cps" style="margin-top:0">Rows with problems will <b>not</b> be imported. Fix them in your file and import again, or add them by hand.</p>`:""}
  ${needS&&n?`<label class="cps" style="display:block;margin-bottom:.6rem">Status for rows that have none<select id="ims"><option value="">Leave blank</option>${STATUS.map(s=>`<option value="${esc(s)}"${s==="Active"?" selected":""}>${esc(sl(s))}</option>`).join("")}</select></label>`:""}
  ${sec("Problems (not imported)","r","r","alert",bad,x=>line(x,x.msgs.join(" ")),true)}
  ${sec("Skipped","y","r","pause",skipped,x=>line(x,x.why),false)}
  ${sec("Notes","y","r","alert",notes,x=>line(x,x.msg),false)}
  ${sec("Will be imported","g","g","check",ready,x=>line(x,""),!bad.length&&!skipped.length)}
  ${!n&&!bad.length&&!skipped.length?'<p class="none">Nothing to import.</p>':""}</div>
  <div class="foot"><button type="button" class="lft" id="imb">Choose Another File</button><button type="button" class="pri" id="imo"${n?"":" disabled"}>Import ${n} Member${n===1?"":"s"}</button></div></div>`;
  $("#imb").onclick=()=>openImport();
  $("#imo").onclick=async()=>{
    if(!n)return;
    if(!await reauth())return;
    const defS=$("#ims")?$("#ims").value:"";
    busy(`Importing ${n} member${n===1?"":"s"}…`);
    try{
      for(let i=0;i<n;i+=200){const b=writeBatch(db);
        ready.slice(i,i+200).forEach(r=>{const ref=doc(collection(db,"members"));b.set(ref,{...r.data,status:r.data.status||defS});logH(b,"Imported","member",ref.id,r.name,[])});
        await withTimeout(b.commit(),30000)}
      busyEnd();$("#dlg").close();toast(`${n} member${n===1?"":"s"} imported.`);
    }catch(x){busyEnd();alert(x.message==="timeout"?slowMsg:"The import could not finish. Some members may already have been added. Import the same file again and those will be skipped.")}
  };
}

function openExport(){
  const opts=(a,all,lb=x=>x)=>`<option value="">${all}</option>`+a.map(x=>`<option value="${esc(x)}">${esc(lb(x))}</option>`).join("");
  $("#dlg").innerHTML=`<form id="xf"><div class="dh"><h2>Export</h2></div><div class="bd"><div class="grid">
  <label class="w">What do you want to export?<select name="type"><option value="att">Attendance Sheet (PDF)</option><option value="pdf">All Member Details (PDF)</option><option value="csv">All Member Details (CSV)</option></select></label>
  <label class="w a">Event Name<input name="title" placeholder="For example, Sunday Mass"></label>
  <label class="a">Date<input name="date" type="date" value="${today}"></label>
  <label>Group<select name="g">${opts(GROUPS,"All Groups",x=>"Group "+x)}</select></label>
  <label>Status<select name="s">${opts(STATUS,"All Statuses",sl)}</select></label></div></div>
  <div class="foot"><button type="button" id="cx">Cancel</button><button class="pri">${ic("expo",18)}Export</button></div></form>`;
  const f=$("#xf"),e=f.elements;
  const sync=()=>{const att=e.type.value==="att";f.querySelectorAll(".a").forEach(x=>x.hidden=!att);e.s.value=att?"Active":""};
  e.type.onchange=sync;sync();
  $("#cx").onclick=()=>$("#dlg").close();
  f.onsubmit=async ev=>{ev.preventDefault();
    const a=members.filter(m=>(!e.g.value||m.group===e.g.value)&&(!e.s.value||m.status===e.s.value)).sort((x,y)=>nm(x).localeCompare(nm(y)));
    if(!a.length){alert("No members match these filters.");return}
    /* Full member details include addresses and contacts, so ask for the password first. */
    if(e.type.value!=="att"&&!await reauth())return;
    $("#dlg").close();
    e.type.value==="csv"?exportCsv(a):e.type.value==="pdf"?printDetails(a):printAtt(a,e.title.value.trim(),e.date.value)};
  $("#dlg").showModal();
}

function openReport(){
  const yrs=[...new Set([String(new Date().getFullYear()),...acts.map(a=>(a.date||"").slice(0,4)).filter(Boolean)])].sort().reverse();
  $("#dlg").innerHTML=`<form id="rf"><div class="dh"><h2>Ministry Report</h2><small class="hint">A summary of the whole ministry for the parish priest, including its activities. It names only officers and award recipients, and has no contact details.</small></div>
  <div class="bd"><div class="grid"><label class="w">Prepared for<input name="to" value="Parish Priest"></label><label class="w">Prepared by<input name="by" placeholder="Your name and position (optional)"></label>

async function printDoc(html,land){
  $("#pr").innerHTML=html;
  $("#pg").textContent=`@page{size:${land?"landscape":"portrait"};margin:${land?"8mm":"12mm"}}`;
  await Promise.all([...document.images].filter(i=>$("#pr").contains(i)).map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
  const done=()=>{$("#pr").innerHTML="";removeEventListener("afterprint",done)};
  addEventListener("afterprint",done);
  setTimeout(()=>print(),100);
}
const phead=t=>`<div class="ph"><img src="logos/Origin.png" alt="" onerror="this.remove()"><div><h1>Ministry of Altar Servers</h1><p>St. Anthony Ma. Zaccaria Parish | Silangan San Mateo Rizal</p></div></div><h2>${t}</h2>`;

function printAtt(a,t,d){
  printDoc(`${phead("Attendance Sheet")}<p class="pm"><b>Event:</b> ${esc(t)||"______________________"} &nbsp;&nbsp; <b>Date:</b> ${d?fmtL(d):"______________"}</p>
  <table class="pdt att"><thead><tr><th>No.</th><th>Full Name</th><th>Time In</th><th>Time Out</th><th>Signature</th></tr></thead>
  <tbody>${a.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(full(m))}</td><td></td><td></td><td></td></tr>`).join("")}</tbody></table>`,1);
}

function printDetails(a){
  const cols=[["Name",m=>nm(m)],["Status","status"],["Role","role"],["Group","group","n"],["Gender","gender","n"],["Birthday","birthday","d"],["Confirmation","confirmation"],["Contact","contact","n"],["Messenger","messenger"],["Home Address","address"],["Parent/Guardian","guardian"],["Guardian Contact","guardianContact","n"],["School Level","schoolLevel"],["School Name","schoolName"],["Start of Service","start","d"],["End of Service","end","d"],["Dominic Savio Award","dominic","d"],["John Berchmans Award","berchmans","d"]];
  const cell=(m,[,k,t])=>{const v=typeof k==="function"?k(m):t==="d"?fmtS(m[k]):m[k];return `<td${t?' class="nw"':""}>${esc(v)}</td>`};
  printDoc(`${phead("Member Details")}<p class="pm">${a.length} members · Generated ${fmtL(today)}</p>
  <table class="pdt sm"><thead><tr><th>No.</th>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead>
  <tbody>${a.map((m,i)=>`<tr><td class="nw">${i+1}</td>${cols.map(c=>cell(m,c)).join("")}</tr>`).join("")}</tbody></table>`,1);
}

function printProfile(m){
  const rows=[["Personal",[["Gender",m.gender],["Birthday",fmtL(m.birthday)],["Age",m.birthday?age(m.birthday):""],["Sacrament of Confirmation",m.confirmation]]],
   ["Contact",[["Contact Number",m.contact],["Messenger",m.messenger],["Home Address",m.address]]],
   ["Parent or Guardian",[["Name",m.guardian],["Contact Number",m.guardianContact]]],
   ["School",[["Level",m.schoolLevel],["School Name",m.schoolName]]],
   ["Service",[["Role",m.role],["Group",m.group],["Status",m.status],["Started",fmtL(m.start)],["Ended",m.end?fmtL(m.end):m.start?"Ongoing":""],["Time in Service",span(m.start,m.end)]]],
   ["Awards",AW.map(a=>[a.n,(m[a.k]?"Given "+fmtL(m[a.k]):"Not yet received")+" - "+a.d])]];
  printDoc(`${phead("Member Profile")}<h3 class="pn">${esc(full(m))}</h3>
  <p class="pm">${esc([m.role,m.group&&"Group "+m.group,m.status].filter(Boolean).join(" · "))}</p>
  <table class="pdt kv">${rows.map(([t,r])=>`<tr><th colspan="2">${t}</th></tr>`+r.map(([k,x])=>`<tr><td class="k">${k}</td><td>${esc(x)||"—"}</td></tr>`).join("")).join("")}</table>
  <p class="pm" style="margin-top:10px;color:#777">Printed ${fmtL(today)}</p>`,0);
}

function printReport(to,by,yr){
  const tot=members.length,cnt=s=>members.filter(m=>m.status===s).length,A=cnt("Active"),I=cnt("Inactive"),O=tot-A-I;
  const P=n=>tot?Math.round(n/tot*100):0;
  const extra=[...new Set(members.map(m=>m.status).filter(s=>s&&!STATUS.includes(s)))];
  const stRows=[...STATUS,...extra].map(s=>[s,cnt(s)]).concat([["No Status",members.filter(m=>!m.status).length]]).filter(r=>r[1]);
  const gRows=GROUPS.map(g=>{const l=members.filter(m=>m.group===g),a=l.filter(m=>m.status==="Active").length,i=l.filter(m=>m.status==="Inactive").length;return[`Group ${g}`,GTIME[g]||"",l.length,a,i,l.length-a-i]});
  const ung=members.filter(m=>!GROUPS.includes(m.group));
  if(ung.length){const a=ung.filter(m=>m.status==="Active").length,i=ung.filter(m=>m.status==="Inactive").length;gRows.push(["No Group","",ung.length,a,i,ung.length-a-i])}
  const sum=i=>gRows.reduce((s,r)=>s+r[i],0);
  const holder=r=>members.find(m=>m.role===r);
  const oRows=ROLES.map(r=>[r,holder(r)?full(holder(r)):"Vacant"]).concat(members.filter(m=>m.role&&!ROLES.includes(m.role)).map(m=>[m.role,full(m)]));
  const{act,pct}=completeness();
  const cf=act.filter(m=>m.confirmation==="Confirmed").length,nc=act.filter(m=>m.confirmation==="Not Yet Confirmed").length,nr=act.length-cf-nc;
  const aw=[];members.forEach(m=>AW.forEach(a=>{if(m[a.k])aw.push([full(m),a.n,m[a.k]])}));aw.sort((x,y)=>y[2].localeCompare(x[2]));
  const flag=[["Suspended","currently suspended"],["On Leave","currently on leave"],["Probationary","in probation (formation/training)"]].map(([s,t])=>[cnt(s),t]).filter(r=>r[0]);
  const th=h=>`<th${/^\d|Total|Active|Inactive|Other|Members|Share/.test(h)?' class="num"':""}>${h}</th>`;
  const tb=(head,body,foot="")=>`<table class="pdt rt"><thead><tr>${head.map(th).join("")}</tr></thead><tbody>${body}${foot}</tbody></table>`;
  const tr=cells=>`<tr>${cells.map(([v,c])=>`<td${c?` class="${c}"`:""}>${v}</td>`).join("")}</tr>`;

  /* ministry activities */
  const AY=yr==="all"||!yr?acts:acts.filter(a=>(a.date||"").slice(0,4)===yr);
  const aD=AY.filter(a=>a.status==="Done").length,aN=AY.filter(a=>a.status==="Not Done").length,aS=AY.filter(a=>a.status==="Scheduled").length,aL=AY.filter(late).length;
  const aRate=aD+aN?Math.round(aD/(aD+aN)*100):0;
  const aRes=a=>a.status==="Done"?[a.remarks,a.attendees&&"Attendees: "+a.attendees].filter(Boolean).join(" · "):a.status==="Not Done"?(a.reason?"Reason: "+a.reason:""):"";
  const aRows=[...AY].sort(ASC).map(a=>tr([[fmtS(a.date)],[esc(a.title)+(a.type?`<br><small>${esc(a.type)}</small>`:"")],[esc(a.venue)],[late(a)?"Awaiting update":esc(a.status)],[esc(aRes(a))]])).join("");
  const aHtml=AY.length
    ?`<p><b>${AY.length}</b> activit${AY.length===1?"y is":"ies are"} on record: <b>${aD}</b> done, <b>${aN}</b> not done, and <b>${aS}</b> still scheduled${aL?` (${aL} past the date and awaiting an update)`:""}.${aD+aN?` Of the activities already finished, <b>${aRate}%</b> were carried out.`:""}</p>`
      +tb(["Date","Activity","Venue","Status","Remarks / Reason"],aRows)
    :"<p>No activities have been recorded for this period.</p>";

  const html=`<div class="rp">${phead("Ministry Status Report")}
  <p class="pm">As of <b>${fmtL(today)}</b> · Prepared for: <b>${esc(to||"Parish Priest")}</b></p>
  <p>As of ${fmtL(today)}, the Ministry of Altar Servers has <b>${tot}</b> member${tot===1?"":"s"}. <b>${A}</b> ${A===1?"is":"are"} currently active (${P(A)}%) and <b>${I}</b> ${I===1?"is":"are"} inactive${O?`, while <b>${O}</b> ${O===1?"has":"have"} another status`:""}.</p>
  <div class="kp"><div><b>${tot}</b><span>Total Members</span></div><div><b>${A}</b><span>Active</span></div><div><b>${I}</b><span>Inactive</span></div><div><b>${O}</b><span>Other Status</span></div></div>
  <h3>Membership by Group</h3>
  ${tb(["Group","Sunday Mass","Total","Active","Inactive","Other"],gRows.map(r=>tr([[esc(r[0])],[esc(r[1])],[r[2],"num"],[r[3],"num"],[r[4],"num"],[r[5],"num"]])).join(""),tr([["Total"],[""],[sum(2),"num"],[sum(3),"num"],[sum(4),"num"],[sum(5),"num"]]).replace("<tr>",'<tr class="tot">'))}
  <h3>Membership by Status</h3>
  ${tb(["Status","Members","Share",""],stRows.map(([s,k])=>tr([[esc(s)],[k,"num"],[P(k)+"%","num"],[`<span class="rbar" style="width:${Math.max(P(k),2)}%"></span>`]])).join(""))}
  <h3>Officers and Leaders</h3>
  ${tb(["Role","Name"],oRows.map(([r,n])=>tr([[esc(r)],[n==="Vacant"?"<i>Vacant</i>":esc(n)]])).join(""))}
  <h3>Ministry Activities (${yr==="all"||!yr?"All Years":esc(yr)})</h3>
  ${aHtml}
  <h3>Formation and Sacraments</h3>
  <p>Among the <b>${act.length}</b> active member${act.length===1?"":"s"}: <b>${cf}</b> ha${cf===1?"s":"ve"} received the Sacrament of Confirmation, <b>${nc}</b> ${nc===1?"has":"have"} not yet, and <b>${nr}</b> ${nr===1?"has":"have"} no record.</p>
  <h3>Awards and Recognition</h3>
  ${aw.length?tb(["Member","Award","Date Given"],aw.map(r=>tr([[esc(r[0])],[esc(r[1])],[fmtS(r[2])]])).join("")):"<p>No awards have been recorded yet.</p>"}
  <h3>Points for Attention</h3>
  <ul>${flag.map(([k,t])=>`<li><b>${k}</b> member${k===1?" is":"s are"} ${t}.</li>`).join("")}${aL?`<li><b>${aL}</b> past ${aL===1?"activity has":"activities have"} no Done or Not Done update yet.</li>`:""}${aN?`<li><b>${aN}</b> ${aN===1?"activity was":"activities were"} not carried out. See the reasons above.</li>`:""}<li>Records of active members are <b>${pct}%</b> complete.</li></ul>
  <div class="sgn"><div>Prepared by:<br><b>${esc(by)||"&nbsp;"}</b></div><div>Received by:<br><b>${esc(to)||"&nbsp;"}</b></div></div>
  <p class="rnote">Confidential. This report contains no contact details of members or families.</p></div>`;
  printDoc(html,0);
}

function exportCsv(a){
  const q=v=>{v=String(v??"");if(/^[=+\-@\t\r]/.test(v))v="'"+v;return `"${v.replace(/"/g,'""')}"`};
  const rows=[F.map(f=>q(f[1])).join(",")].concat(a.map(m=>F.map(f=>q(m[f[0]])).join(",")));
  const l=document.createElement("a");
  l.href=URL.createObjectURL(new Blob(["\ufeff"+rows.join("\r\n")],{type:"text/csv"}));
  l.download="members-"+today+".csv";l.click();
}
